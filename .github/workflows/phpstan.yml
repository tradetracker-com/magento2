name: Upgrade, Compile and PHPStan
on:
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.phtml'
      - '**/*.xml'
      - 'composer.json'
      - 'phpstan.neon'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - PHP_VERSION: php82-fpm
            MAGENTO_VERSION: 2.4.7-p10
          - PHP_VERSION: php83-fpm
            MAGENTO_VERSION: 2.4.8-p5
          - PHP_VERSION: php84-fpm
            MAGENTO_VERSION: 2.4.8-p5
          - PHP_VERSION: php85-fpm
            MAGENTO_VERSION: 2.4.9
    name: PHP ${{ matrix.PHP_VERSION }} Magento ${{ matrix.MAGENTO_VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Docker
        run: docker run --detach --name magento-project-community-edition michielgerritsen/magento-project-community-edition:${{ matrix.PHP_VERSION }}-magento${{ matrix.MAGENTO_VERSION }}

      - name: Resolve the module directory
        run: echo "MODULE_DIR=$(basename "$PWD")" >> "$GITHUB_ENV"

      - name: Remove version from composer.json
        run: sed -i '/version/d' ./composer.json

      - name: Upload our code into the docker container
        run: docker cp $(pwd) magento-project-community-edition:/data/extensions/

      - name: Install the extensions in Magento
        run: docker exec magento-project-community-edition ./install-composer-package tradetracker-com/magento2:@dev

      - name: Activate the extension
        run: docker exec magento-project-community-edition ./retry "php bin/magento module:enable TradeTracker_Connect && php bin/magento setup:upgrade && php bin/magento setup:di:compile"

      # The PHPStan Magento extension lives in Test/vendor, next to PHPUnit (see Test/composer.json).
      - name: Install the analysis dependencies
        run: docker exec magento-project-community-edition /bin/bash -c "cd /data/extensions/$MODULE_DIR/Test && composer install --no-interaction --prefer-dist --no-progress"

      # Runs from the Magento root on purpose: the extension resolves Magento's own classes, and
      # from inside the module directory it cannot find them.
      - name: Run PHPStan
        run: docker exec magento-project-community-edition /bin/bash -c "cd /data && ./vendor/bin/phpstan analyse --no-progress -a extensions/$MODULE_DIR/Test/vendor/autoload.php -c extensions/$MODULE_DIR/phpstan.neon extensions/$MODULE_DIR"
